name: CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_zone: ${{ vars.GCP_ZONE }}
  TF_VAR_username: ${{ vars.GCP_VM_USERNAME }}

jobs:
  terraform-cd:
    name: "Terraform Application"
    runs-on: "ubuntu-latest"
    environment: production
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: GCP authentication
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Save generated group_vars artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-group-vars
          path: ansible/group_vars/all.yml

  ansible-cd:
    name: "Ansible Application"
    runs-on: "ubuntu-latest"
    needs: terraform-cd
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: GCP authentication
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download generated group_vars artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-group-vars
          path: ansible/group_vars

      - name: Extract ssh key from terraform
        run: |
          cd ../terraform
          terraform init -input=false
          terraform output -raw ssh_private_key > ../ansible/id_ssh
          chmod 600 ../ansible/id_ssh

      - name: Install Ansible dependencies
        run: pip install ansible google-auth requests

      - name: Application Playbook
        run: ansible-playbook -i inventory.gcp.yml playbooks/application.yml --private-key id_ssh

      - name: Webserver Playbook
        run: ansible-playbook -i inventory.gcp.yml playbooks/webserver.yml --private-key id_ssh